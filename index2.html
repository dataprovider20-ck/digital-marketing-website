function wireForm(){
  const f = document.getElementById('enqForm'); if(!f) return;
  const st = document.getElementById('fstat');
  f.addEventListener('submit', async e => {
    e.preventDefault(); st.className=''; st.textContent='';
    if(!f.reportValidity()) return;
    const data = Object.fromEntries(new FormData(f).entries());
    if(!SITE.formEndpoint){ st.className='ok'; st.textContent='Thank you. The form works, but it is not connected to an inbox yet, so nothing was sent.'; return; }
    try{
      const r = await fetch(SITE.formEndpoint,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(data)});
      if(!r.ok) throw new Error(r.status);
      f.reset(); st.className='ok'; st.textContent='Thank you. We have received your enquiry and will contact you soon.';
    }catch(err){ st.className='err'; st.textContent='Your enquiry could not be sent. Please try again or call us.'; }
  });
}
function route(){
  const h = location.hash.slice(1) || 'home', s = SERVICES.find(x=>x.id===h), isEnq = h==='enquiry';
  app.innerHTML = s ? service(s) : h==='contact' ? contact() : home();
  document.title = (s ? s.title : h==='contact' ? 'Contact us' : 'Home') + ' · ' + SITE.name;
  document.querySelectorAll('#svcnav a').forEach(a=>{ a.dataset.id===h ? a.setAttribute('aria-current','page') : a.removeAttribute('aria-current'); });
  const cur = document.querySelector('#svcnav a[aria-current]'); if (cur) cur.scrollIntoView({inline:'center',block:'nearest'});
  if(isEnq){ document.getElementById('enquiry-form').scrollIntoView(); } else { window.scrollTo(0,0); }
  wireForm();
}
